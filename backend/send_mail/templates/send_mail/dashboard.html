{% extends 'base.html' %}
{% load static %}

{% block title %}Send Mail{% endblock %}

{% block content %}

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

<div class="container mt-4">

    {% if messages %}
        <div class="mt-3">
            {% for message in messages %}
            <div class="
                alert 
                {% if message.tags == 'success' %}alert-success
                {% elif message.tags == 'error' %}alert-danger
                {% elif message.tags == 'warning' %}alert-warning
                {% else %}alert-info{% endif %}
                alert-dismissible fade show" role="alert">

                {{ message }}

                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        </div>
    {% endif %}

    <h2>📧 Send Mail</h2>

    <form method="POST">
        {% csrf_token %}

        <!-- Hostel चयन -->
        <div class="mb-3">
            <label for="hostel" class="form-label">Select Hostel</label>
            <select name="hostel" id="hostel" class="form-control" required>
                <option value="">-- Select Hostel --</option>
                <option value="all">All Hostels</option>  <!-- ✅ NEW -->

                {% for hostel in hostels %}
                    <option value="{{ hostel.id }}">{{ hostel.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Subject -->
        <div class="mb-3">
            <label for="subject" class="form-label">Subject</label>
            <input type="text" name="subject" id="subject" class="form-control" placeholder="Enter subject" required>
        </div>

        <!-- Body -->
        <div class="mb-3">
            <label class="form-label">Message</label>

            <!-- Editor -->
            <div id="editor" style="height: 200px;"></div>

            <!-- Hidden input (important for Django) -->
            <input type="hidden" name="body" id="body">
        </div>

        <!-- Buttons -->
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Send</button>
            <a href="{% url 'send_mail:dashboard' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
    var quill = new Quill('#editor', {
        theme: 'snow',
        placeholder: 'Write your message...',
        modules: {
            toolbar: [
                ['bold', 'italic', 'underline'],   // basic styles
                [{ 'align': [] }],                 // alignment
                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                ['link'],
                ['clean']
            ]
        }
    });

    // Copy content to hidden input before submit
    document.querySelector("form").onsubmit = function() {
        document.querySelector("#body").value = quill.root.innerHTML;
    };
</script>

{% endblock %}
