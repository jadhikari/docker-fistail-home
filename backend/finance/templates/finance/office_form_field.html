<div class="{{ width }}" id="field-{{ field.name }}">

    <label class="form-label fw-semibold small{% if field.name == 'is_active' %} me-2{% endif %}"
           for="{{ field.id_for_label }}">

        {{ field.label }}

        {% if field.field.required %}
            <span class="required-mark">*</span>
        {% endif %}

        {% if field.name == 'bank_account' or field.name == 'credit_card' %}
            <span class="required-mark d-none"
                  id="required-{{ field.name }}">
                *
            </span>
        {% endif %}

    </label>

    {% if field.name == 'amount' %}
        <div class="amount-wrap">
            {{ field }}
        </div>
    {% else %}
        {{ field }}
    {% endif %}

    {% if field.help_text %}
        <div class="form-text">
            {{ field.help_text }}
        </div>
    {% endif %}

    {% if field.errors %}
        <div class="text-danger small mt-1">
            <i class="bi bi-exclamation-circle me-1"></i>
            {{ field.errors|striptags }}
        </div>
    {% endif %}

</div>
