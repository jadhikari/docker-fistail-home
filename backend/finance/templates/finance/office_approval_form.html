{% extends "base.html" %}
{% block title %}Review {{ record.transaction_code }}{% endblock %}
{% block content %}
<div class="container py-4"><div class="card shadow-sm"><div class="card-header"><h5 class="mb-0">Review {{ record.transaction_code }}</h5></div>
<div class="card-body">
  <p><strong>Amount:</strong> ¥{{ record.amount|floatformat:0 }} &nbsp; <strong>Created by:</strong> {{ record.created_by }}</p>
  <form method="post">{% csrf_token %}
    <label class="form-label fw-semibold" for="status_memo">Decision note (required when rejecting)</label>
    <textarea class="form-control" id="status_memo" name="status_memo" rows="3">{{ status_memo }}</textarea>
    <div class="mt-3 d-flex gap-2">
      <button class="btn btn-success" name="decision" value="APPROVED">Approve</button>
      <button class="btn btn-danger" name="decision" value="REJECTED">Reject</button>
      <a class="btn btn-outline-secondary" href="{% url cancel_url_name %}">Cancel</a>
    </div>
  </form>
</div></div></div>
{% endblock %}
